spring.application.name=saloon-service

server.port=8083

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-service}:${DB_PORT:3306}/${DB_NAME:saloon-service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis-service}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Distributed tracing (OpenTelemetry -> Tempo OTLP)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo.observability.svc.cluster.local:4318/v1/traces
management.tracing.propagation.type=w3c

# Stdout for Fluent Bit -> Loki; trace correlation in MDC (architecture doc)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n

# Swagger/OpenAPI "Servers" base URL when docs are opened from the API gateway (e.g. http://api.saloon.local/...).
# Use "/" so "Try it out" calls stay on the same host as the gateway (matches identity-service).
api.gateway.url=${API_PUBLIC_BASE_URL:/}

