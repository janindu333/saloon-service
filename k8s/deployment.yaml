apiVersion: apps/v1
kind: Deployment
metadata:
  name: saloon-service
  namespace: saloon-system
  labels:
    app: saloon-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saloon-service
  template:
    metadata:
      labels:
        app: saloon-service
    spec:
      containers:
        - name: saloon-service
          image: saloon-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            # Explicit so Spring's api.gateway.url is not corrupted by K8s-injected API_GATEWAY_* service env vars.
            - name: API_GATEWAY_URL
              value: "/"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: SPRING_REDIS_HOST
              value: "redis-service"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: DB_USERNAME
              value: "saloon_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saloon-secrets
                  key: db-password
            - name: DB_NAME
              value: "saloon_service"
            - name: DB_HOST
              value: "mysql-service"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saloon-secrets
                  key: jwt-secret
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8082"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
